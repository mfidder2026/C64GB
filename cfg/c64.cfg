MEMORY {
    ZPRUN:    start = $00BC, size = $0034, type = rw;     # zero page dispatcher
    LOADADDR: start = $07FF, size = $0002, file = %O;
    MAIN:     start = $0801, size = $2FFF, file = %O, fill = yes, define = yes;
    BRLOAD:   start = $3800, size = $0800, file = %O, fill = yes;   # browser load image
    HILOAD:   start = $4000, size = $0500, file = %O;   # image of the code at $C300
    BRUN:     start = $9000, size = $1000;              # browser runs in free GB memory
    HIRUN:    start = $C300, size = $0500;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN, type = ro;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    ZPCODE:   load = MAIN, run = ZPRUN, type = rw, define = yes;
    BSS:      load = MAIN, type = bss, define = yes;
    # The ROM browser is copied from $3800 to $9000 (and the REU) at start-up;
    # afterwards $3800-$3FFF holds the GBC conversion tables.
    BROWSER:  load = BRLOAD, run = BRUN, type = ro, define = yes;
    # Extra resident code, copied from $4000 to $C300 on the first start.
    HICODE:   load = HILOAD, run = HIRUN, type = ro, define = yes;
}
