MEMORY {
    ZPRUN:    start = $00BC, size = $0034, type = rw;     # zero page dispatcher
    HDR:  start = $0000, size = $000C, file = %O;
    MAIN: start = $0800, size = $3800, file = %O, define = yes;
}
SEGMENTS {
    EXEHDR: load = HDR,  type = ro;
    CODE:   load = MAIN, type = ro;
    RODATA: load = MAIN, type = ro;
    ZPCODE:   load = MAIN, run = ZPRUN, type = rw, define = yes;
    BSS:    load = MAIN, type = bss, define = yes;
}
